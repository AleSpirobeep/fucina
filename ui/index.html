<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <style>
      :root {
        --colore-sfondo: #eef1f4;
        --colore-sfondo-rialzato: #ffffff;
        --colore-testo: #141a21;
        --colore-testo-attenuato: #57626e;
        --colore-bordo: #c6ced7;
        --colore-accento: #2a5d9f;
        --colore-accento-scuro: #1e4676;
        --colore-accento-testo: #ffffff;
        --colore-ok: #1d6b52;
        --colore-ambra: #8a5a00;
        --colore-ambra-sfondo: #fdefd2;
        --colore-ambra-bordo: #d6a13c;
        --colore-ambra-testo: #3a2606;
        --colore-ambra-bottone-testo: #fff8ee;
        --colore-errore: #a02a2a;
        --colore-errore-sfondo: #fadfdf;
        --font-titoli: "Archivo", "Segoe UI", system-ui, sans-serif;
        --font-testo: "Newsreader", Georgia, "Times New Roman", serif;
        --font-dati: "JetBrains Mono", "Consolas", "SFMono-Regular", monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --colore-sfondo: #101418;
          --colore-sfondo-rialzato: #181e25;
          --colore-testo: #e6ecf2;
          --colore-testo-attenuato: #98a5b3;
          --colore-bordo: #2c353f;
          --colore-accento: #7fb2f0;
          --colore-accento-scuro: #a9cbf7;
          --colore-accento-testo: #0a1620;
          --colore-ok: #63c39b;
          --colore-ambra: #e8b45f;
          --colore-ambra-sfondo: #37280f;
          --colore-ambra-bordo: #8a6520;
          --colore-ambra-testo: #fbeed4;
          --colore-ambra-bottone-testo: #2b1c00;
          --colore-errore: #e89393;
          --colore-errore-sfondo: #381a1a;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 1200px;
        max-width: 1400px;
        margin: 0 auto;
        padding: 1.5rem 2rem 3rem;
        background: var(--colore-sfondo);
        color: var(--colore-testo);
        font-family: var(--font-testo);
        font-size: 1rem;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      h1,
      h2,
      h3 {
        font-family: var(--font-titoli);
        font-weight: 600;
        color: var(--colore-testo);
      }

      h1 {
        font-size: 1.75rem;
        margin-bottom: 1rem;
      }

      h2 {
        font-size: 1.25rem;
      }

      h3 {
        font-size: 1.05rem;
        margin-bottom: 0.5rem;
      }

      a {
        color: var(--colore-accento-scuro);
      }

      a:hover {
        color: var(--colore-accento);
      }

      button {
        font-family: var(--font-titoli);
        font-size: 0.9rem;
        font-weight: 600;
        background: var(--colore-accento);
        color: var(--colore-accento-testo);
        border: 1px solid var(--colore-accento-scuro);
        border-radius: 0.3rem;
        padding: 0.4rem 0.9rem;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      section {
        background: var(--colore-sfondo-rialzato);
        border: 1px solid var(--colore-bordo);
        border-radius: 0.5rem;
        padding: 1rem 1.25rem;
        margin-bottom: 1.5rem;
      }

      #dashboard > section {
        margin-top: 1.5rem;
      }

      #rigaStato {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        margin: 1rem 0 1.5rem;
        padding: 0.75rem 1rem;
        background: var(--colore-sfondo-rialzato);
        border: 1px solid var(--colore-bordo);
        border-radius: 0.5rem;
        font-family: var(--font-dati);
        font-size: 0.9rem;
      }

      #rigaStato p {
        margin: 0;
      }

      #ultimoAggiornamento {
        font-family: var(--font-dati);
        font-size: 0.85rem;
        color: var(--colore-testo-attenuato);
      }

      #banner {
        font-family: var(--font-dati);
        font-size: 0.85rem;
        background: var(--colore-errore-sfondo);
        color: var(--colore-errore);
        border: 1px solid var(--colore-errore);
        border-radius: 0.4rem;
        padding: 0.6rem 0.9rem;
        margin-top: 0.75rem;
      }

      #aspettanoTe {
        background: var(--colore-ambra-sfondo);
        border: 1px solid var(--colore-ambra-bordo);
        border-left: 0.4rem solid var(--colore-ambra);
        color: var(--colore-ambra-testo);
      }

      #aspettanoTe h2,
      #aspettanoTe h3 {
        color: var(--colore-ambra-testo);
      }

      #aspettanoTe a {
        color: var(--colore-ambra-testo);
      }

      #aspettanoTe ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      #aspettanoTe li {
        border-top: 1px solid var(--colore-ambra-bordo);
        padding: 0.75rem 0;
      }

      #aspettanoTe li:first-child {
        border-top: none;
        padding-top: 0.25rem;
      }

      .avviso-pm-spento {
        margin-top: 0.5rem;
        background: var(--colore-ambra-sfondo);
        border: 1px solid var(--colore-ambra-bordo);
        border-left: 0.4rem solid var(--colore-ambra);
        color: var(--colore-ambra-testo);
        border-radius: 0.3rem;
        padding: 0.6rem 0.8rem;
      }

      .avviso-pm-spento a {
        color: var(--colore-ambra-testo);
      }

      .avviso-pm-spento ul {
        list-style: none;
        padding: 0;
        margin: 0 0 0.5rem;
      }

      .avviso-pm-spento p {
        margin: 0.3rem 0;
      }

      .rispondi-form {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        margin-top: 0.5rem;
        max-width: 40rem;
      }

      .rispondi-form textarea {
        font-family: var(--font-testo);
        font-size: 0.95rem;
        border: 1px solid var(--colore-ambra-bordo);
        border-radius: 0.3rem;
        padding: 0.5rem;
      }

      .rispondi-form button {
        align-self: flex-start;
      }

      .griglia-secondaria {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
        gap: 1.5rem;
        align-items: start;
      }

      .griglia-secondaria > section {
        min-width: 0;
        margin-bottom: 0;
      }

      table {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        font-family: var(--font-dati);
        font-size: 0.85rem;
      }

      th,
      td {
        text-align: left;
        vertical-align: top;
        border: 1px solid var(--colore-bordo);
        padding: 0.4rem 0.5rem;
      }

      th {
        background: var(--colore-sfondo);
        font-weight: 500;
      }

      td ul {
        margin: 0;
        padding-left: 1.1rem;
      }

      label {
        font-family: var(--font-titoli);
        font-size: 0.9rem;
      }

      input,
      textarea {
        font-family: var(--font-testo);
        background: var(--colore-sfondo-rialzato);
        color: var(--colore-testo);
        border: 1px solid var(--colore-bordo);
        border-radius: 0.3rem;
        padding: 0.4rem;
      }

      [role="alert"] {
        color: var(--colore-errore);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <h1>Registro</h1>

    <section id="configurazione" hidden>
      <h2>Configurazione</h2>
      <form id="formConfigurazione">
        <div>
          <label for="repoTesto">Repo (proprietario/nome, uno per riga)</label><br />
          <textarea id="repoTesto" rows="6" cols="40"></textarea>
        </div>
        <div>
          <label for="token">Token</label><br />
          <input type="password" id="token" autocomplete="off" />
        </div>
        <p id="erroreConfigurazione" role="alert"></p>
        <button type="submit">Salva</button>
      </form>
    </section>

    <section id="dashboard" hidden>
      <h2>Dashboard</h2>
      <button id="apriConfigurazione">Configurazione</button>
      <button id="dimenticaToken">Dimentica il token</button>
      <button id="aggiornaOra">Aggiorna</button>
      <p id="ultimoAggiornamento"></p>
      <div id="banner" role="alert" hidden></div>

      <div id="rigaStato"></div>

      <section id="aspettanoTe">
        <h2>Aspettano te</h2>
        <div id="elencoAspettanoTe"></div>
      </section>

      <div class="griglia-secondaria">
        <section id="avanzamento">
          <h2>Avanzamento</h2>
          <div id="tabelleAvanzamento"></div>
        </section>

        <section id="agentiAttivi">
          <h2>Agenti attivi</h2>
          <div id="elencoAgentiAttivi"></div>
        </section>
      </div>
    </section>

    <script type="module">
      import {
        validaElencoRepo,
        configurazioneValida,
        parseElencoRepo,
        classifica,
        tabellaAvanzamento,
        agentiAttivi,
        formattaTempoTrascorso,
        ultimoCommento,
        elementoPrCoda,
        ErroreGitHub,
        formattaOra,
        creaStatoSezione,
        aggiornaStatoRepo,
        creaStatoAggiornamento,
        avviaAggiornamento,
        terminaAggiornamento,
        testoRispostaValido,
        messaggioConfermaRisposta,
        messaggioErroreFase,
        contaInCoda,
        rigaPm,
        messaggioStatoPmNonAggiornato,
        testoEsecuzioniInCorsoPm,
        messaggioConfermaAvvia,
        lavoroInAttesa,
        avvisoPmSpento,
        rigaStato,
      } from "./lib.js";
      import {
        issueAperte,
        issueChiuseDiRecente,
        prAperte,
        commentiIssue,
        statoCheckPr,
        runWorkflow,
        rispondiERiavvia,
        ErroreFase,
        statoPm,
        ultimaEsecuzionePm,
        fermaPm,
        avviaPm,
      } from "./github.js";

      const CHIAVE_TOKEN = "fucina.token";
      const CHIAVE_REPO = "fucina.repoTesto";

      const sezioneConfigurazione = document.getElementById("configurazione");
      const sezioneDashboard = document.getElementById("dashboard");
      const form = document.getElementById("formConfigurazione");
      const campoRepo = document.getElementById("repoTesto");
      const campoToken = document.getElementById("token");
      const erroreConfigurazione = document.getElementById("erroreConfigurazione");
      const tabelleAvanzamento = document.getElementById("tabelleAvanzamento");
      const elencoAgentiAttivi = document.getElementById("elencoAgentiAttivi");
      const elencoAspettanoTe = document.getElementById("elencoAspettanoTe");
      const pulsanteAggiorna = document.getElementById("aggiornaOra");
      const etichettaUltimoAggiornamento = document.getElementById("ultimoAggiornamento");
      const banner = document.getElementById("banner");
      const elementoRigaStato = document.getElementById("rigaStato");

      const INTERVALLO_AGGIORNAMENTO_MS = 60 * 1000;

      let statoAggiornamento = creaStatoAggiornamento();
      let statoAspettanoTe = creaStatoSezione();
      let statoAvanzamentoRepo = creaStatoSezione();
      let statoAgentiAttiviRepo = creaStatoSezione();
      let statoPmRepo = creaStatoSezione();
      let statoEsecuzioniFermaPm = {};
      let statoEsitoAvvioPm = {};

      function tokenSalvato() {
        return localStorage.getItem(CHIAVE_TOKEN) || "";
      }

      function aggiungiMessaggioErrore(sezione, messaggio) {
        const p = document.createElement("p");
        p.setAttribute("role", "alert");
        p.textContent = messaggio;
        sezione.appendChild(p);
      }

      function marcaSezioneNonAggiornata(sezione, errore) {
        const p = document.createElement("p");
        p.setAttribute("role", "alert");
        p.textContent = `Dati non aggiornati: ${errore}`;
        sezione.insertBefore(p, sezione.children[1] || null);
      }

      function costruisciSezioneRepo(repo) {
        const sezione = document.createElement("section");
        const titolo = document.createElement("h3");
        titolo.textContent = repo;
        sezione.appendChild(titolo);
        return sezione;
      }

      function costruisciTabellaRepo(repo, classificazione) {
        const sezione = costruisciSezioneRepo(repo);
        const tabella = document.createElement("table");
        const righeIntestazione = document.createElement("tr");
        const righeCorpo = document.createElement("tr");

        for (const colonna of tabellaAvanzamento(classificazione)) {
          const th = document.createElement("th");
          th.textContent = `${colonna.etichetta} (${colonna.conteggio})`;
          righeIntestazione.appendChild(th);

          const td = document.createElement("td");
          if (colonna.elementi.length === 0) {
            td.textContent = "-";
          } else {
            const elenco = document.createElement("ul");
            for (const elemento of colonna.elementi) {
              const voce = document.createElement("li");
              const link = document.createElement("a");
              link.href = elemento.url;
              link.textContent = elemento.titolo;
              voce.appendChild(link);
              elenco.appendChild(voce);
            }
            td.appendChild(elenco);
          }
          righeCorpo.appendChild(td);
        }

        const thead = document.createElement("thead");
        thead.appendChild(righeIntestazione);
        const tbody = document.createElement("tbody");
        tbody.appendChild(righeCorpo);
        tabella.appendChild(thead);
        tabella.appendChild(tbody);
        sezione.appendChild(tabella);
        return sezione;
      }

      // REQ-403: se non è ancora arrivato il primo giro di caricaPm() non c'è
      // niente da mostrare — nessuna riga vuota sotto la tabella (a differenza
      // di un dato scaduto, che si mostra comunque marcato come tale).
      // REQ-411, 416, 417: parte al primo click senza conferma, resta
      // disabilitato mentre il comando è in corso (evita due richieste da un
      // doppio click), e aggiorna lo stato mostrato senza attendere il ciclo
      // dei sessanta secondi.
      async function gestisciFermaPm(repo, pulsante) {
        pulsante.disabled = true;
        try {
          const esecuzioni = await fermaPm(tokenSalvato(), repo);
          statoEsecuzioniFermaPm = { ...statoEsecuzioniFermaPm, [repo]: esecuzioni };
          await caricaPm();
        } catch (errore) {
          const messaggio =
            errore instanceof ErroreGitHub ? errore.message : "Errore nel fermare il PM.";
          statoPmRepo = aggiornaStatoRepo(statoPmRepo, repo, { ok: false, errore: messaggio });
          renderAvanzamento(parseElencoRepo(localStorage.getItem(CHIAVE_REPO) || ""));
        }
      }

      // REQ-413, 414, 417: chiede conferma nominando il repo, e solo confermando
      // disabilita il pulsante e lancia L4 -> S2 -> S3, in quest'ordine fisso.
      // REQ-416: a comando riuscito o parzialmente riuscito lo stato si aggiorna
      // subito, senza attendere il ciclo dei sessanta secondi.
      async function gestisciAvviaPm(repo, pulsante) {
        if (!window.confirm(messaggioConfermaAvvia(repo))) return;

        pulsante.disabled = true;
        try {
          const risultato = await avviaPm(tokenSalvato(), repo);
          statoEsitoAvvioPm = { ...statoEsitoAvvioPm, [repo]: risultato };
          await caricaPm();
        } catch (errore) {
          const messaggio =
            errore instanceof ErroreFase
              ? messaggioErroreFase(errore.fase, errore.causa.message)
              : errore instanceof ErroreGitHub
                ? errore.message
                : "Errore nell'avviare il PM.";
          statoPmRepo = aggiornaStatoRepo(statoPmRepo, repo, { ok: false, errore: messaggio });
          renderAvanzamento(parseElencoRepo(localStorage.getItem(CHIAVE_REPO) || ""));
        }
      }

      function costruisciElencoEsecuzioniFerma(esecuzioni) {
        const div = document.createElement("div");
        const p = document.createElement("p");
        p.textContent = testoEsecuzioniInCorsoPm(esecuzioni);
        div.appendChild(p);

        if (esecuzioni.length > 0) {
          const elenco = document.createElement("ul");
          for (const esecuzione of esecuzioni) {
            const voce = document.createElement("li");
            const link = document.createElement("a");
            link.href = esecuzione.url;
            link.textContent = esecuzione.titolo;
            voce.appendChild(link);
            elenco.appendChild(voce);
          }
          div.appendChild(elenco);
        }

        return div;
      }

      function costruisciGruppoAvviso(etichetta, elementi) {
        if (elementi.length === 0) return null;
        const div = document.createElement("div");
        const p = document.createElement("p");
        p.textContent = `${etichetta} (${elementi.length}):`;
        div.appendChild(p);
        const elenco = document.createElement("ul");
        for (const elemento of elementi) {
          const voce = document.createElement("li");
          const link = document.createElement("a");
          link.href = elemento.html_url;
          link.textContent = elemento.title;
          voce.appendChild(link);
          elenco.appendChild(voce);
        }
        div.appendChild(elenco);
        return div;
      }

      // REQ-420, 421: l'avviso compare solo con il PM spento e lavoro in attesa,
      // e nomina ogni elemento in attesa per tipo.
      function costruisciAvvisoPmSpento(avviso) {
        const div = document.createElement("div");
        div.className = "avviso-pm-spento";
        div.setAttribute("role", "alert");

        const titolo = document.createElement("p");
        titolo.textContent = `Lavoro in attesa (${avviso.totale}):`;
        div.appendChild(titolo);

        for (const [etichetta, elementi] of [
          ["PR da revisionare", avviso.prDaRevisionare],
          ["Domande", avviso.domande],
          ["Task in coda", avviso.inCoda],
        ]) {
          const gruppo = costruisciGruppoAvviso(etichetta, elementi);
          if (gruppo) div.appendChild(gruppo);
        }

        return div;
      }

      function costruisciRigaPm(inCoda, lavoro, pmVoce, adesso, repo) {
        if (!pmVoce) return null;

        const div = document.createElement("div");
        div.className = "riga-pm";

        if (pmVoce.dati) {
          const { stato, ultimaEsecuzione } = pmVoce.dati;
          const info = rigaPm(stato, inCoda, ultimaEsecuzione, adesso);

          const statoP = document.createElement("p");
          statoP.textContent = info.testoStato;
          div.appendChild(statoP);

          const inCodaP = document.createElement("p");
          inCodaP.textContent = info.testoInCoda;
          div.appendChild(inCodaP);

          if (info.ultimaEsecuzione) {
            const p = document.createElement("p");
            p.textContent = info.ultimaEsecuzione.testo;
            if (info.ultimaEsecuzione.url) {
              p.append(" ");
              const link = document.createElement("a");
              link.href = info.ultimaEsecuzione.url;
              link.textContent = "Vedi esecuzione";
              p.appendChild(link);
            }
            div.appendChild(p);
          }

          if (info.pulsante) {
            const pulsante = document.createElement("button");
            pulsante.type = "button";
            pulsante.textContent = info.pulsante;
            if (info.pulsante === "Ferma") {
              pulsante.addEventListener("click", () => gestisciFermaPm(repo, pulsante));
            } else if (info.pulsante === "Avvia") {
              pulsante.addEventListener("click", () => gestisciAvviaPm(repo, pulsante));
            }
            div.appendChild(pulsante);
          }

          const esecuzioniFerma = statoEsecuzioniFermaPm[repo];
          if (esecuzioniFerma) {
            div.appendChild(costruisciElencoEsecuzioniFerma(esecuzioniFerma));
          }

          const esitoAvvio = statoEsitoAvvioPm[repo];
          if (esitoAvvio && esitoAvvio.errore) {
            aggiungiMessaggioErrore(div, esitoAvvio.errore);
          }

          const avviso = avvisoPmSpento(stato, lavoro);
          if (avviso) div.appendChild(costruisciAvvisoPmSpento(avviso));
        }

        if (pmVoce.nonAggiornato) {
          aggiungiMessaggioErrore(div, messaggioStatoPmNonAggiornato(pmVoce.errore));
        }

        return div;
      }

      function renderAvanzamento(repos) {
        tabelleAvanzamento.innerHTML = "";
        const adesso = new Date().toISOString();
        for (const repo of repos) {
          const voce = statoAvanzamentoRepo[repo];
          if (!voce) continue;

          if (voce.dati) {
            const sezione = costruisciTabellaRepo(repo, voce.dati.classificazione);
            const rigaPmEl = costruisciRigaPm(
              voce.dati.inCoda,
              voce.dati.lavoro,
              statoPmRepo[repo],
              adesso,
              repo,
            );
            if (rigaPmEl) sezione.appendChild(rigaPmEl);
            if (voce.nonAggiornato) marcaSezioneNonAggiornata(sezione, voce.errore);
            tabelleAvanzamento.appendChild(sezione);
          } else {
            const sezione = costruisciSezioneRepo(repo);
            aggiungiMessaggioErrore(sezione, voce.errore);
            tabelleAvanzamento.appendChild(sezione);
          }
        }
      }

      async function caricaAvanzamento() {
        const token = tokenSalvato();
        const repos = parseElencoRepo(localStorage.getItem(CHIAVE_REPO) || "");

        for (const repo of repos) {
          try {
            const [issueAperteRepo, issueChiuseRepo, prRepo] = await Promise.all([
              issueAperte(token, repo),
              issueChiuseDiRecente(token, repo),
              prAperte(token, repo),
            ]);
            const classificazione = classifica(
              [...issueAperteRepo, ...issueChiuseRepo],
              prRepo,
              new Date().toISOString(),
            );
            statoAvanzamentoRepo = aggiornaStatoRepo(statoAvanzamentoRepo, repo, {
              ok: true,
              dati: {
                classificazione,
                inCoda: contaInCoda(issueAperteRepo),
                lavoro: lavoroInAttesa(issueAperteRepo, prRepo),
              },
            });
          } catch (errore) {
            const messaggio =
              errore instanceof ErroreGitHub
                ? errore.message
                : "Errore nel caricamento dell'avanzamento.";
            statoAvanzamentoRepo = aggiornaStatoRepo(statoAvanzamentoRepo, repo, {
              ok: false,
              errore: messaggio,
            });
          }
        }

        renderAvanzamento(repos);
      }

      // REQ-401, 402: solo due letture per repo (L1, e L2 se installato) — il
      // conteggio in-coda arriva da caricaAvanzamento, non da una terza chiamata.
      async function caricaPm() {
        const token = tokenSalvato();
        const repos = parseElencoRepo(localStorage.getItem(CHIAVE_REPO) || "");

        for (const repo of repos) {
          try {
            const stato = await statoPm(token, repo);
            const ultimaEsecuzione = stato === "non-installato" ? null : await ultimaEsecuzionePm(token, repo);
            statoPmRepo = aggiornaStatoRepo(statoPmRepo, repo, {
              ok: true,
              dati: { stato, ultimaEsecuzione },
            });
          } catch (errore) {
            const messaggio =
              errore instanceof ErroreGitHub
                ? errore.message
                : "Errore nel caricamento dello stato del PM.";
            statoPmRepo = aggiornaStatoRepo(statoPmRepo, repo, { ok: false, errore: messaggio });
          }
        }

        renderAvanzamento(repos);
      }

      function costruisciSezioneAgentiAttivi(repo, agenti) {
        const sezione = costruisciSezioneRepo(repo);

        if (agenti.length === 0) {
          const messaggio = document.createElement("p");
          messaggio.textContent = "Nessun agente al lavoro";
          sezione.appendChild(messaggio);
          return sezione;
        }

        const elenco = document.createElement("ul");
        const adesso = new Date().toISOString();
        for (const agente of agenti) {
          const voce = document.createElement("li");
          const link = document.createElement("a");
          link.href = agente.url;
          link.textContent = agente.titolo;
          voce.appendChild(link);
          voce.append(` — ${formattaTempoTrascorso(agente.avviatoA, adesso)}`);
          elenco.appendChild(voce);
        }
        sezione.appendChild(elenco);
        return sezione;
      }

      function renderAgentiAttivi(repos) {
        elencoAgentiAttivi.innerHTML = "";
        for (const repo of repos) {
          const voce = statoAgentiAttiviRepo[repo];
          if (!voce) continue;

          if (voce.dati) {
            const sezione = costruisciSezioneAgentiAttivi(repo, voce.dati);
            if (voce.nonAggiornato) marcaSezioneNonAggiornata(sezione, voce.errore);
            elencoAgentiAttivi.appendChild(sezione);
          } else {
            const sezione = costruisciSezioneRepo(repo);
            aggiungiMessaggioErrore(sezione, voce.errore);
            elencoAgentiAttivi.appendChild(sezione);
          }
        }
      }

      async function caricaAgentiAttivi() {
        const token = tokenSalvato();
        const repos = parseElencoRepo(localStorage.getItem(CHIAVE_REPO) || "");

        for (const repo of repos) {
          try {
            const runs = await runWorkflow(token, repo);
            statoAgentiAttiviRepo = aggiornaStatoRepo(statoAgentiAttiviRepo, repo, {
              ok: true,
              dati: agentiAttivi(runs),
            });
          } catch (errore) {
            const messaggio =
              errore instanceof ErroreGitHub
                ? errore.message
                : "Errore nel caricamento degli agenti attivi.";
            statoAgentiAttiviRepo = aggiornaStatoRepo(statoAgentiAttiviRepo, repo, {
              ok: false,
              errore: messaggio,
            });
          }
        }

        renderAgentiAttivi(repos);
      }

      function costruisciFormRispondiERiavvia(issue, repo) {
        const contenitore = document.createElement("div");
        contenitore.className = "rispondi-form";
        const campo = document.createElement("textarea");
        campo.rows = 3;
        campo.placeholder = "Scrivi la risposta…";
        const pulsante = document.createElement("button");
        pulsante.type = "button";
        pulsante.textContent = "Rispondi e riavvia";
        pulsante.disabled = true;
        const erroreRisposta = document.createElement("p");
        erroreRisposta.setAttribute("role", "alert");

        campo.addEventListener("input", () => {
          pulsante.disabled = !testoRispostaValido(campo.value);
        });

        pulsante.addEventListener("click", async () => {
          const testo = campo.value;
          if (!testoRispostaValido(testo)) return;
          if (!window.confirm(messaggioConfermaRisposta(issue, testo))) return;

          erroreRisposta.textContent = "";
          pulsante.disabled = true;
          campo.disabled = true;

          try {
            await rispondiERiavvia(tokenSalvato(), repo, issue.number, testo);
            campo.value = "";
            await aggiorna();
          } catch (fallimento) {
            erroreRisposta.textContent =
              fallimento instanceof ErroreFase
                ? messaggioErroreFase(fallimento.fase, fallimento.causa.message)
                : fallimento.message;
            campo.disabled = false;
            pulsante.disabled = !testoRispostaValido(campo.value);
          }
        });

        contenitore.appendChild(campo);
        contenitore.appendChild(pulsante);
        contenitore.appendChild(erroreRisposta);
        return contenitore;
      }

      function costruisciVoceIssueBloccata(issue, commento, repo) {
        const voce = document.createElement("li");
        const link = document.createElement("a");
        link.href = issue.html_url;
        link.textContent = issue.title;
        voce.appendChild(link);
        if (commento) {
          const p = document.createElement("p");
          p.textContent = commento;
          voce.appendChild(p);
        }
        voce.appendChild(costruisciFormRispondiERiavvia(issue, repo));
        return voce;
      }

      function costruisciVocePrInRevisione(elemento, statoCheck) {
        const voce = document.createElement("li");
        const link = document.createElement("a");
        link.href = elemento.url;
        link.textContent = elemento.titolo;
        voce.appendChild(link);
        voce.append(` — check: ${statoCheck}`);

        const nonFatto = document.createElement("p");
        nonFatto.textContent = `Non fatto: ${elemento.nonFatto || "(sezione assente dal corpo della PR)"}`;
        voce.appendChild(nonFatto);

        const fattoInPiu = document.createElement("p");
        fattoInPiu.textContent = `Fatto in più: ${elemento.fattoInPiu || "(sezione assente dal corpo della PR)"}`;
        voce.appendChild(fattoInPiu);

        return voce;
      }

      function renderAspettanoTe(repos) {
        elencoAspettanoTe.innerHTML = "";
        let haElementi = false;

        for (const repo of repos) {
          const voce = statoAspettanoTe[repo];
          if (!voce) continue;

          if (voce.dati) {
            const { issueBloccate, prInRevisione } = voce.dati;
            if (issueBloccate.length === 0 && prInRevisione.length === 0) continue;
            haElementi = true;

            const sezione = costruisciSezioneRepo(repo);
            const elenco = document.createElement("ul");
            for (const { issue, commento } of issueBloccate) {
              elenco.appendChild(costruisciVoceIssueBloccata(issue, commento, repo));
            }
            for (const { elemento, statoCheck } of prInRevisione) {
              elenco.appendChild(costruisciVocePrInRevisione(elemento, statoCheck));
            }
            sezione.appendChild(elenco);
            if (voce.nonAggiornato) marcaSezioneNonAggiornata(sezione, voce.errore);
            elencoAspettanoTe.appendChild(sezione);
          } else {
            haElementi = true;
            const sezione = costruisciSezioneRepo(repo);
            aggiungiMessaggioErrore(sezione, voce.errore);
            elencoAspettanoTe.appendChild(sezione);
          }
        }

        if (!haElementi) {
          const messaggio = document.createElement("p");
          messaggio.textContent = "Niente aspetta te";
          elencoAspettanoTe.appendChild(messaggio);
        }
      }

      async function caricaAspettanoTe() {
        const token = tokenSalvato();
        const repos = parseElencoRepo(localStorage.getItem(CHIAVE_REPO) || "");

        for (const repo of repos) {
          try {
            const [issueAperteRepo, prRepo] = await Promise.all([
              issueAperte(token, repo),
              prAperte(token, repo),
            ]);
            const classificazione = classifica(issueAperteRepo, prRepo, new Date().toISOString());

            const issueBloccate = [];
            for (const issue of classificazione.bloccate) {
              const commenti = await commentiIssue(token, repo, issue.number);
              issueBloccate.push({ issue, commento: ultimoCommento(commenti) });
            }

            const prInRevisione = [];
            for (const pr of classificazione.inRevisione) {
              const statoCheck = await statoCheckPr(token, repo, pr.head.sha);
              prInRevisione.push({ elemento: elementoPrCoda(pr), statoCheck });
            }

            statoAspettanoTe = aggiornaStatoRepo(statoAspettanoTe, repo, {
              ok: true,
              dati: { issueBloccate, prInRevisione },
            });
          } catch (errore) {
            const messaggio =
              errore instanceof ErroreGitHub ? errore.message : "Errore nel caricamento della coda.";
            statoAspettanoTe = aggiornaStatoRepo(statoAspettanoTe, repo, {
              ok: false,
              errore: messaggio,
            });
          }
        }

        renderAspettanoTe(repos);
      }

      function aggiornaEtichettaUltimoAggiornamento() {
        etichettaUltimoAggiornamento.textContent = statoAggiornamento.ultimoAggiornamento
          ? `Ultimo aggiornamento riuscito: ${formattaOra(statoAggiornamento.ultimoAggiornamento)}`
          : "Nessun aggiornamento riuscito finora.";
      }

      function aggiornaBanner() {
        const errori = [];
        for (const [nomeSezione, stato] of [
          ["Aspettano te", statoAspettanoTe],
          ["Avanzamento", statoAvanzamentoRepo],
          ["Agenti attivi", statoAgentiAttiviRepo],
          ["PM", statoPmRepo],
        ]) {
          for (const [repo, voce] of Object.entries(stato)) {
            if (voce.errore) errori.push(`${repo} (${nomeSezione}): ${voce.errore}`);
          }
        }

        if (errori.length === 0) {
          banner.hidden = true;
          banner.textContent = "";
        } else {
          banner.hidden = false;
          banner.textContent = errori.join(" · ");
        }
      }

      // REQ-501, 502, 503: la riga in cima, prima di «Aspettano te», composta
      // solo dai dati che caricaPm, caricaAgentiAttivi e caricaAvanzamento
      // hanno già scaricato — nessuna chiamata qui dentro.
      function renderRigaStato() {
        elementoRigaStato.innerHTML = "";
        const repos = parseElencoRepo(localStorage.getItem(CHIAVE_REPO) || "");
        const stato = rigaStato(repos, statoPmRepo, statoAgentiAttiviRepo, statoAvanzamentoRepo);

        if (!stato.configurato) {
          const messaggio = document.createElement("p");
          messaggio.textContent = "Nessun repo configurato.";
          elementoRigaStato.appendChild(messaggio);

          const pulsante = document.createElement("button");
          pulsante.type = "button";
          pulsante.textContent = "Configurazione";
          pulsante.addEventListener("click", mostraConfigurazione);
          elementoRigaStato.appendChild(pulsante);
          return;
        }

        for (const voce of stato.voci) {
          const p = document.createElement("p");
          if (!voce.completo) p.setAttribute("role", "alert");
          p.textContent = `${voce.repo} — ${voce.testo}`;
          elementoRigaStato.appendChild(p);
        }
      }

      async function aggiorna() {
        const nuovoStato = avviaAggiornamento(statoAggiornamento);
        if (!nuovoStato) return;
        statoAggiornamento = nuovoStato;
        pulsanteAggiorna.disabled = true;

        await Promise.all([caricaAspettanoTe(), caricaAvanzamento(), caricaAgentiAttivi(), caricaPm()]);

        const haErrori =
          Object.values(statoAspettanoTe).some((voce) => voce.errore) ||
          Object.values(statoAvanzamentoRepo).some((voce) => voce.errore) ||
          Object.values(statoAgentiAttiviRepo).some((voce) => voce.errore) ||
          Object.values(statoPmRepo).some((voce) => voce.errore);

        statoAggiornamento = terminaAggiornamento(statoAggiornamento, new Date().toISOString(), haErrori);
        pulsanteAggiorna.disabled = false;
        aggiornaEtichettaUltimoAggiornamento();
        aggiornaBanner();
        renderRigaStato();
      }

      let intervalloAggiornamento = null;

      function mostraDashboard() {
        sezioneConfigurazione.hidden = true;
        sezioneDashboard.hidden = false;
        renderRigaStato();
        aggiorna();
        if (intervalloAggiornamento === null) {
          intervalloAggiornamento = setInterval(aggiorna, INTERVALLO_AGGIORNAMENTO_MS);
        }
      }

      pulsanteAggiorna.addEventListener("click", aggiorna);

      function mostraConfigurazione() {
        erroreConfigurazione.textContent = "";
        campoRepo.value = localStorage.getItem(CHIAVE_REPO) || "";
        campoToken.value = "";
        campoToken.placeholder = tokenSalvato()
          ? "lascia vuoto per non cambiare il token attuale"
          : "Token personale di GitHub";
        sezioneConfigurazione.hidden = false;
        sezioneDashboard.hidden = true;
      }

      form.addEventListener("submit", (evento) => {
        evento.preventDefault();

        const repoTesto = campoRepo.value;
        const validazioneRepo = validaElencoRepo(repoTesto);
        if (!validazioneRepo.ok) {
          erroreConfigurazione.textContent = validazioneRepo.errore;
          return;
        }

        const tokenInserito = campoToken.value.trim();
        const token = tokenInserito.length > 0 ? tokenInserito : tokenSalvato();
        if (!configurazioneValida({ repoTesto, token })) {
          erroreConfigurazione.textContent = "Inserisci un token.";
          return;
        }

        localStorage.setItem(CHIAVE_REPO, repoTesto);
        localStorage.setItem(CHIAVE_TOKEN, token);
        mostraDashboard();
      });

      document
        .getElementById("apriConfigurazione")
        .addEventListener("click", mostraConfigurazione);

      document.getElementById("dimenticaToken").addEventListener("click", () => {
        localStorage.removeItem(CHIAVE_TOKEN);
        mostraConfigurazione();
      });

      if (tokenSalvato()) {
        mostraDashboard();
      } else {
        mostraConfigurazione();
      }
    </script>
  </body>
</html>
