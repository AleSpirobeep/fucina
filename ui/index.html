<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <style>
      :root {
        color-scheme: light dark;

        --font-titoli: "Archivo", "Segoe UI", Arial, sans-serif;
        --font-testo: "Newsreader", Georgia, "Times New Roman", serif;
        --font-dati: "JetBrains Mono", Consolas, "Courier New", monospace;

        --spazio-1: 4px;
        --spazio-2: 8px;
        --spazio-3: 16px;
        --spazio-4: 24px;
        --spazio-5: 32px;
        --raggio: 8px;

        --colore-sfondo: #eef2f0;
        --colore-superficie: #ffffff;
        --colore-superficie-alt: #e2e9e5;
        --colore-testo: #1c2624;
        --colore-testo-secondario: #51605a;
        --colore-bordo: #cad6d0;

        --colore-petrolio: #0e6a6e;
        --colore-petrolio-testo: #08494c;
        --colore-petrolio-sfondo: #dcf0ef;

        --colore-ambra: #a8660c;
        --colore-ambra-testo: #6b4409;
        --colore-ambra-sfondo: #fbecd2;
        --colore-ambra-bordo: #e3a94f;

        --colore-verde: #2e7d4f;
        --colore-rosso: #b3261e;

        --ombra-scheda: 0 1px 3px rgba(15, 35, 30, 0.08);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --colore-sfondo: #101513;
          --colore-superficie: #1a211f;
          --colore-superficie-alt: #212a27;
          --colore-testo: #e6ede9;
          --colore-testo-secondario: #a3b3ac;
          --colore-bordo: #303d38;

          --colore-petrolio: #57c2c4;
          --colore-petrolio-testo: #8fdadb;
          --colore-petrolio-sfondo: #16302f;

          --colore-ambra: #eab363;
          --colore-ambra-testo: #f3cd94;
          --colore-ambra-sfondo: #3a2c14;
          --colore-ambra-bordo: #8a611f;

          --colore-verde: #6bcb92;
          --colore-rosso: #f0847c;

          --ombra-scheda: 0 1px 3px rgba(0, 0, 0, 0.5);
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--colore-sfondo);
        color: var(--colore-testo);
        font-family: var(--font-testo);
        font-size: 16px;
        line-height: 1.5;
        overflow-wrap: break-word;
      }

      h1,
      h2,
      h3 {
        font-family: var(--font-titoli);
        font-weight: 600;
        color: var(--colore-testo);
        margin: 0 0 var(--spazio-3);
      }

      h1 {
        font-size: 1.75rem;
        letter-spacing: 0.01em;
      }
      h2 {
        font-size: 1.2rem;
      }
      h3 {
        font-size: 1.02rem;
      }

      a {
        color: var(--colore-petrolio-testo);
      }
      a:hover {
        color: var(--colore-petrolio);
      }

      .pagina {
        max-width: 1440px;
        min-width: 1200px;
        margin: 0 auto;
        padding: var(--spazio-5) var(--spazio-5) 64px;
      }

      .barra-controlli {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: var(--spazio-3);
        margin-bottom: var(--spazio-4);
      }

      .controlli {
        display: flex;
        gap: var(--spazio-2);
        flex-wrap: wrap;
      }

      .testo-dati {
        font-family: var(--font-dati);
        font-size: 0.8rem;
        color: var(--colore-testo-secondario);
        margin: 0;
      }

      button,
      .pulsante {
        font-family: var(--font-dati);
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid var(--colore-bordo);
        background: var(--colore-superficie);
        color: var(--colore-petrolio-testo);
        cursor: pointer;
      }
      button:hover {
        background: var(--colore-petrolio-sfondo);
        border-color: var(--colore-petrolio);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        background: var(--colore-superficie);
        border-color: var(--colore-bordo);
      }

      .pulsante-primario {
        background: var(--colore-petrolio-sfondo);
        border-color: var(--colore-petrolio);
      }

      .pulsante-ambra {
        background: var(--colore-ambra-sfondo);
        border-color: var(--colore-ambra-bordo);
        color: var(--colore-ambra-testo);
      }
      .pulsante-ambra:hover:not(:disabled) {
        background: var(--colore-ambra-bordo);
      }

      .banner {
        border-left: 4px solid var(--colore-rosso);
        background: var(--colore-superficie-alt);
        color: var(--colore-rosso);
        padding: 12px 16px;
        border-radius: 6px;
        font-family: var(--font-dati);
        font-size: 0.85rem;
        margin-bottom: var(--spazio-4);
      }

      .scheda {
        background: var(--colore-superficie);
        border: 1px solid var(--colore-bordo);
        border-radius: var(--raggio);
        box-shadow: var(--ombra-scheda);
        padding: var(--spazio-4);
        margin-bottom: var(--spazio-4);
      }

      .scheda-aspettano-te {
        border-left: 6px solid var(--colore-ambra-bordo);
        background: var(--colore-ambra-sfondo);
      }
      .scheda-aspettano-te h2 {
        color: var(--colore-ambra-testo);
      }

      .griglia-secondaria {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: var(--spazio-4);
        align-items: start;
      }

      ul {
        margin: 0;
        padding-left: 1.1em;
      }
      li {
        margin-bottom: var(--spazio-2);
      }

      table {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        font-size: 0.88rem;
      }
      th {
        font-family: var(--font-dati);
        text-transform: uppercase;
        font-size: 0.68rem;
        letter-spacing: 0.03em;
        text-align: left;
        color: var(--colore-testo-secondario);
        background: var(--colore-superficie-alt);
        padding: var(--spazio-2);
        border-bottom: 2px solid var(--colore-bordo);
      }
      td {
        vertical-align: top;
        padding: var(--spazio-2);
        border-bottom: 1px solid var(--colore-bordo);
        word-break: break-word;
      }

      label {
        font-family: var(--font-dati);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--colore-testo-secondario);
      }

      textarea,
      input {
        width: 100%;
        font-family: var(--font-testo);
        font-size: 1rem;
        padding: 8px;
        border: 1px solid var(--colore-bordo);
        border-radius: 6px;
        background: var(--colore-superficie);
        color: var(--colore-testo);
        margin-top: var(--spazio-1);
      }

      p[role="alert"] {
        color: var(--colore-rosso);
        font-family: var(--font-dati);
        font-size: 0.82rem;
      }
    </style>
  </head>
  <body>
    <div class="pagina">
      <header>
        <h1>Registro</h1>
      </header>

      <section id="configurazione" class="scheda" hidden>
        <h2>Configurazione</h2>
        <form id="formConfigurazione">
          <div>
            <label for="repoTesto">Repo (proprietario/nome, uno per riga)</label><br />
            <textarea id="repoTesto" rows="6" cols="40"></textarea>
          </div>
          <div>
            <label for="token">Token</label><br />
            <input type="password" id="token" autocomplete="off" />
          </div>
          <p id="erroreConfigurazione" role="alert"></p>
          <button type="submit" class="pulsante-primario">Salva</button>
        </form>
      </section>

      <section id="dashboard" hidden>
        <div class="barra-controlli">
          <div class="controlli">
            <button id="apriConfigurazione">Configurazione</button>
            <button id="dimenticaToken">Dimentica il token</button>
            <button id="aggiornaOra" class="pulsante-primario">Aggiorna</button>
          </div>
          <p id="ultimoAggiornamento" class="testo-dati"></p>
        </div>
        <div id="banner" class="banner" role="alert" hidden></div>

        <section id="aspettanoTe" class="scheda scheda-aspettano-te">
          <h2>Aspettano te</h2>
          <div id="elencoAspettanoTe"></div>
        </section>

        <div class="griglia-secondaria">
          <section id="avanzamento" class="scheda">
            <h2>Avanzamento</h2>
            <div id="tabelleAvanzamento"></div>
          </section>

          <section id="agentiAttivi" class="scheda">
            <h2>Agenti attivi</h2>
            <div id="elencoAgentiAttivi"></div>
          </section>
        </div>
      </section>
    </div>

    <script type="module">
      import {
        validaElencoRepo,
        configurazioneValida,
        parseElencoRepo,
        classifica,
        tabellaAvanzamento,
        agentiAttivi,
        formattaTempoTrascorso,
        ultimoCommento,
        elementoPrCoda,
        ErroreGitHub,
        formattaOra,
        creaStatoSezione,
        aggiornaStatoRepo,
        creaStatoAggiornamento,
        avviaAggiornamento,
        terminaAggiornamento,
        testoRispostaValido,
        messaggioConfermaRisposta,
        messaggioErroreFase,
      } from "./lib.js";
      import {
        issueAperte,
        issueChiuseDiRecente,
        prAperte,
        commentiIssue,
        statoCheckPr,
        runWorkflow,
        rispondiERiavvia,
        ErroreFase,
      } from "./github.js";

      const CHIAVE_TOKEN = "fucina.token";
      const CHIAVE_REPO = "fucina.repoTesto";

      const sezioneConfigurazione = document.getElementById("configurazione");
      const sezioneDashboard = document.getElementById("dashboard");
      const form = document.getElementById("formConfigurazione");
      const campoRepo = document.getElementById("repoTesto");
      const campoToken = document.getElementById("token");
      const erroreConfigurazione = document.getElementById("erroreConfigurazione");
      const tabelleAvanzamento = document.getElementById("tabelleAvanzamento");
      const elencoAgentiAttivi = document.getElementById("elencoAgentiAttivi");
      const elencoAspettanoTe = document.getElementById("elencoAspettanoTe");
      const pulsanteAggiorna = document.getElementById("aggiornaOra");
      const etichettaUltimoAggiornamento = document.getElementById("ultimoAggiornamento");
      const banner = document.getElementById("banner");

      const INTERVALLO_AGGIORNAMENTO_MS = 60 * 1000;

      let statoAggiornamento = creaStatoAggiornamento();
      let statoAspettanoTe = creaStatoSezione();
      let statoAvanzamentoRepo = creaStatoSezione();
      let statoAgentiAttiviRepo = creaStatoSezione();

      function tokenSalvato() {
        return localStorage.getItem(CHIAVE_TOKEN) || "";
      }

      function aggiungiMessaggioErrore(sezione, messaggio) {
        const p = document.createElement("p");
        p.setAttribute("role", "alert");
        p.textContent = messaggio;
        sezione.appendChild(p);
      }

      function marcaSezioneNonAggiornata(sezione, errore) {
        const p = document.createElement("p");
        p.setAttribute("role", "alert");
        p.textContent = `Dati non aggiornati: ${errore}`;
        sezione.insertBefore(p, sezione.children[1] || null);
      }

      function costruisciSezioneRepo(repo) {
        const sezione = document.createElement("section");
        const titolo = document.createElement("h3");
        titolo.textContent = repo;
        sezione.appendChild(titolo);
        return sezione;
      }

      function costruisciTabellaRepo(repo, classificazione) {
        const sezione = costruisciSezioneRepo(repo);
        const tabella = document.createElement("table");
        const righeIntestazione = document.createElement("tr");
        const righeCorpo = document.createElement("tr");

        for (const colonna of tabellaAvanzamento(classificazione)) {
          const th = document.createElement("th");
          th.textContent = `${colonna.etichetta} (${colonna.conteggio})`;
          righeIntestazione.appendChild(th);

          const td = document.createElement("td");
          if (colonna.elementi.length === 0) {
            td.textContent = "-";
          } else {
            const elenco = document.createElement("ul");
            for (const elemento of colonna.elementi) {
              const voce = document.createElement("li");
              const link = document.createElement("a");
              link.href = elemento.url;
              link.textContent = elemento.titolo;
              voce.appendChild(link);
              elenco.appendChild(voce);
            }
            td.appendChild(elenco);
          }
          righeCorpo.appendChild(td);
        }

        const thead = document.createElement("thead");
        thead.appendChild(righeIntestazione);
        const tbody = document.createElement("tbody");
        tbody.appendChild(righeCorpo);
        tabella.appendChild(thead);
        tabella.appendChild(tbody);
        sezione.appendChild(tabella);
        return sezione;
      }

      function renderAvanzamento(repos) {
        tabelleAvanzamento.innerHTML = "";
        for (const repo of repos) {
          const voce = statoAvanzamentoRepo[repo];
          if (!voce) continue;

          if (voce.dati) {
            const sezione = costruisciTabellaRepo(repo, voce.dati);
            if (voce.nonAggiornato) marcaSezioneNonAggiornata(sezione, voce.errore);
            tabelleAvanzamento.appendChild(sezione);
          } else {
            const sezione = costruisciSezioneRepo(repo);
            aggiungiMessaggioErrore(sezione, voce.errore);
            tabelleAvanzamento.appendChild(sezione);
          }
        }
      }

      async function caricaAvanzamento() {
        const token = tokenSalvato();
        const repos = parseElencoRepo(localStorage.getItem(CHIAVE_REPO) || "");

        for (const repo of repos) {
          try {
            const [issueAperteRepo, issueChiuseRepo, prRepo] = await Promise.all([
              issueAperte(token, repo),
              issueChiuseDiRecente(token, repo),
              prAperte(token, repo),
            ]);
            const classificazione = classifica(
              [...issueAperteRepo, ...issueChiuseRepo],
              prRepo,
              new Date().toISOString(),
            );
            statoAvanzamentoRepo = aggiornaStatoRepo(statoAvanzamentoRepo, repo, {
              ok: true,
              dati: classificazione,
            });
          } catch (errore) {
            const messaggio =
              errore instanceof ErroreGitHub
                ? errore.message
                : "Errore nel caricamento dell'avanzamento.";
            statoAvanzamentoRepo = aggiornaStatoRepo(statoAvanzamentoRepo, repo, {
              ok: false,
              errore: messaggio,
            });
          }
        }

        renderAvanzamento(repos);
      }

      function costruisciSezioneAgentiAttivi(repo, agenti) {
        const sezione = costruisciSezioneRepo(repo);

        if (agenti.length === 0) {
          const messaggio = document.createElement("p");
          messaggio.textContent = "Nessun agente al lavoro";
          sezione.appendChild(messaggio);
          return sezione;
        }

        const elenco = document.createElement("ul");
        const adesso = new Date().toISOString();
        for (const agente of agenti) {
          const voce = document.createElement("li");
          const link = document.createElement("a");
          link.href = agente.url;
          link.textContent = agente.titolo;
          voce.appendChild(link);
          voce.append(` — ${formattaTempoTrascorso(agente.avviatoA, adesso)}`);
          elenco.appendChild(voce);
        }
        sezione.appendChild(elenco);
        return sezione;
      }

      function renderAgentiAttivi(repos) {
        elencoAgentiAttivi.innerHTML = "";
        for (const repo of repos) {
          const voce = statoAgentiAttiviRepo[repo];
          if (!voce) continue;

          if (voce.dati) {
            const sezione = costruisciSezioneAgentiAttivi(repo, voce.dati);
            if (voce.nonAggiornato) marcaSezioneNonAggiornata(sezione, voce.errore);
            elencoAgentiAttivi.appendChild(sezione);
          } else {
            const sezione = costruisciSezioneRepo(repo);
            aggiungiMessaggioErrore(sezione, voce.errore);
            elencoAgentiAttivi.appendChild(sezione);
          }
        }
      }

      async function caricaAgentiAttivi() {
        const token = tokenSalvato();
        const repos = parseElencoRepo(localStorage.getItem(CHIAVE_REPO) || "");

        for (const repo of repos) {
          try {
            const runs = await runWorkflow(token, repo);
            statoAgentiAttiviRepo = aggiornaStatoRepo(statoAgentiAttiviRepo, repo, {
              ok: true,
              dati: agentiAttivi(runs),
            });
          } catch (errore) {
            const messaggio =
              errore instanceof ErroreGitHub
                ? errore.message
                : "Errore nel caricamento degli agenti attivi.";
            statoAgentiAttiviRepo = aggiornaStatoRepo(statoAgentiAttiviRepo, repo, {
              ok: false,
              errore: messaggio,
            });
          }
        }

        renderAgentiAttivi(repos);
      }

      function costruisciFormRispondiERiavvia(issue, repo) {
        const contenitore = document.createElement("div");
        const campo = document.createElement("textarea");
        campo.rows = 3;
        campo.placeholder = "Scrivi la risposta…";
        const pulsante = document.createElement("button");
        pulsante.type = "button";
        pulsante.className = "pulsante-ambra";
        pulsante.textContent = "Rispondi e riavvia";
        pulsante.disabled = true;
        const erroreRisposta = document.createElement("p");
        erroreRisposta.setAttribute("role", "alert");

        campo.addEventListener("input", () => {
          pulsante.disabled = !testoRispostaValido(campo.value);
        });

        pulsante.addEventListener("click", async () => {
          const testo = campo.value;
          if (!testoRispostaValido(testo)) return;
          if (!window.confirm(messaggioConfermaRisposta(issue, testo))) return;

          erroreRisposta.textContent = "";
          pulsante.disabled = true;
          campo.disabled = true;

          try {
            await rispondiERiavvia(tokenSalvato(), repo, issue.number, testo);
            campo.value = "";
            await aggiorna();
          } catch (fallimento) {
            erroreRisposta.textContent =
              fallimento instanceof ErroreFase
                ? messaggioErroreFase(fallimento.fase, fallimento.causa.message)
                : fallimento.message;
            campo.disabled = false;
            pulsante.disabled = !testoRispostaValido(campo.value);
          }
        });

        contenitore.appendChild(campo);
        contenitore.appendChild(pulsante);
        contenitore.appendChild(erroreRisposta);
        return contenitore;
      }

      function costruisciVoceIssueBloccata(issue, commento, repo) {
        const voce = document.createElement("li");
        const link = document.createElement("a");
        link.href = issue.html_url;
        link.textContent = issue.title;
        voce.appendChild(link);
        if (commento) {
          const p = document.createElement("p");
          p.textContent = commento;
          voce.appendChild(p);
        }
        voce.appendChild(costruisciFormRispondiERiavvia(issue, repo));
        return voce;
      }

      function costruisciVocePrInRevisione(elemento, statoCheck) {
        const voce = document.createElement("li");
        const link = document.createElement("a");
        link.href = elemento.url;
        link.textContent = elemento.titolo;
        voce.appendChild(link);
        voce.append(` — check: ${statoCheck}`);

        const nonFatto = document.createElement("p");
        nonFatto.textContent = `Non fatto: ${elemento.nonFatto || "(sezione assente dal corpo della PR)"}`;
        voce.appendChild(nonFatto);

        const fattoInPiu = document.createElement("p");
        fattoInPiu.textContent = `Fatto in più: ${elemento.fattoInPiu || "(sezione assente dal corpo della PR)"}`;
        voce.appendChild(fattoInPiu);

        return voce;
      }

      function renderAspettanoTe(repos) {
        elencoAspettanoTe.innerHTML = "";
        let haElementi = false;

        for (const repo of repos) {
          const voce = statoAspettanoTe[repo];
          if (!voce) continue;

          if (voce.dati) {
            const { issueBloccate, prInRevisione } = voce.dati;
            if (issueBloccate.length === 0 && prInRevisione.length === 0) continue;
            haElementi = true;

            const sezione = costruisciSezioneRepo(repo);
            const elenco = document.createElement("ul");
            for (const { issue, commento } of issueBloccate) {
              elenco.appendChild(costruisciVoceIssueBloccata(issue, commento, repo));
            }
            for (const { elemento, statoCheck } of prInRevisione) {
              elenco.appendChild(costruisciVocePrInRevisione(elemento, statoCheck));
            }
            sezione.appendChild(elenco);
            if (voce.nonAggiornato) marcaSezioneNonAggiornata(sezione, voce.errore);
            elencoAspettanoTe.appendChild(sezione);
          } else {
            haElementi = true;
            const sezione = costruisciSezioneRepo(repo);
            aggiungiMessaggioErrore(sezione, voce.errore);
            elencoAspettanoTe.appendChild(sezione);
          }
        }

        if (!haElementi) {
          const messaggio = document.createElement("p");
          messaggio.textContent = "Niente aspetta te";
          elencoAspettanoTe.appendChild(messaggio);
        }
      }

      async function caricaAspettanoTe() {
        const token = tokenSalvato();
        const repos = parseElencoRepo(localStorage.getItem(CHIAVE_REPO) || "");

        for (const repo of repos) {
          try {
            const [issueAperteRepo, prRepo] = await Promise.all([
              issueAperte(token, repo),
              prAperte(token, repo),
            ]);
            const classificazione = classifica(issueAperteRepo, prRepo, new Date().toISOString());

            const issueBloccate = [];
            for (const issue of classificazione.bloccate) {
              const commenti = await commentiIssue(token, repo, issue.number);
              issueBloccate.push({ issue, commento: ultimoCommento(commenti) });
            }

            const prInRevisione = [];
            for (const pr of classificazione.inRevisione) {
              const statoCheck = await statoCheckPr(token, repo, pr.head.sha);
              prInRevisione.push({ elemento: elementoPrCoda(pr), statoCheck });
            }

            statoAspettanoTe = aggiornaStatoRepo(statoAspettanoTe, repo, {
              ok: true,
              dati: { issueBloccate, prInRevisione },
            });
          } catch (errore) {
            const messaggio =
              errore instanceof ErroreGitHub ? errore.message : "Errore nel caricamento della coda.";
            statoAspettanoTe = aggiornaStatoRepo(statoAspettanoTe, repo, {
              ok: false,
              errore: messaggio,
            });
          }
        }

        renderAspettanoTe(repos);
      }

      function aggiornaEtichettaUltimoAggiornamento() {
        etichettaUltimoAggiornamento.textContent = statoAggiornamento.ultimoAggiornamento
          ? `Ultimo aggiornamento riuscito: ${formattaOra(statoAggiornamento.ultimoAggiornamento)}`
          : "Nessun aggiornamento riuscito finora.";
      }

      function aggiornaBanner() {
        const errori = [];
        for (const [nomeSezione, stato] of [
          ["Aspettano te", statoAspettanoTe],
          ["Avanzamento", statoAvanzamentoRepo],
          ["Agenti attivi", statoAgentiAttiviRepo],
        ]) {
          for (const [repo, voce] of Object.entries(stato)) {
            if (voce.errore) errori.push(`${repo} (${nomeSezione}): ${voce.errore}`);
          }
        }

        if (errori.length === 0) {
          banner.hidden = true;
          banner.textContent = "";
        } else {
          banner.hidden = false;
          banner.textContent = errori.join(" · ");
        }
      }

      async function aggiorna() {
        const nuovoStato = avviaAggiornamento(statoAggiornamento);
        if (!nuovoStato) return;
        statoAggiornamento = nuovoStato;
        pulsanteAggiorna.disabled = true;

        await Promise.all([caricaAspettanoTe(), caricaAvanzamento(), caricaAgentiAttivi()]);

        const haErrori =
          Object.values(statoAspettanoTe).some((voce) => voce.errore) ||
          Object.values(statoAvanzamentoRepo).some((voce) => voce.errore) ||
          Object.values(statoAgentiAttiviRepo).some((voce) => voce.errore);

        statoAggiornamento = terminaAggiornamento(statoAggiornamento, new Date().toISOString(), haErrori);
        pulsanteAggiorna.disabled = false;
        aggiornaEtichettaUltimoAggiornamento();
        aggiornaBanner();
      }

      let intervalloAggiornamento = null;

      function mostraDashboard() {
        sezioneConfigurazione.hidden = true;
        sezioneDashboard.hidden = false;
        aggiorna();
        if (intervalloAggiornamento === null) {
          intervalloAggiornamento = setInterval(aggiorna, INTERVALLO_AGGIORNAMENTO_MS);
        }
      }

      pulsanteAggiorna.addEventListener("click", aggiorna);

      function mostraConfigurazione() {
        erroreConfigurazione.textContent = "";
        campoRepo.value = localStorage.getItem(CHIAVE_REPO) || "";
        campoToken.value = "";
        campoToken.placeholder = tokenSalvato()
          ? "lascia vuoto per non cambiare il token attuale"
          : "Token personale di GitHub";
        sezioneConfigurazione.hidden = false;
        sezioneDashboard.hidden = true;
      }

      form.addEventListener("submit", (evento) => {
        evento.preventDefault();

        const repoTesto = campoRepo.value;
        const validazioneRepo = validaElencoRepo(repoTesto);
        if (!validazioneRepo.ok) {
          erroreConfigurazione.textContent = validazioneRepo.errore;
          return;
        }

        const tokenInserito = campoToken.value.trim();
        const token = tokenInserito.length > 0 ? tokenInserito : tokenSalvato();
        if (!configurazioneValida({ repoTesto, token })) {
          erroreConfigurazione.textContent = "Inserisci un token.";
          return;
        }

        localStorage.setItem(CHIAVE_REPO, repoTesto);
        localStorage.setItem(CHIAVE_TOKEN, token);
        mostraDashboard();
      });

      document
        .getElementById("apriConfigurazione")
        .addEventListener("click", mostraConfigurazione);

      document.getElementById("dimenticaToken").addEventListener("click", () => {
        localStorage.removeItem(CHIAVE_TOKEN);
        mostraConfigurazione();
      });

      if (tokenSalvato()) {
        mostraDashboard();
      } else {
        mostraConfigurazione();
      }
    </script>
  </body>
</html>
