# Configurazione della fucina per il repo della fucina stessa.
# La fucina costruisce la propria interfaccia (spec 002) con questo loop.
version: 1

setup_command: ""
test_command: 'node --test "ui/**/*.test.js"'

agente:
  modello: "claude-sonnet-5"
  max_turns: 60
  max_budget_usd: 3.00
  max_iterazioni: 3

strumenti_permessi:
  - "Edit"
  - "Write"
  - "Bash(node:*)"
  - "Bash(git:*)"
  - "Bash(gh issue view:*)"
  - "Bash(gh pr view:*)"

percorsi_protetti:
  - "ui/*.test.js"
  - ".github/workflows/**"
  - "specs/**"
  - ".specify/**"

endpoint: ""
secret_auth: "CLAUDE_CODE_OAUTH_TOKEN"
