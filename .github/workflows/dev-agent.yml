name: dev-agent

# Prende in carico una issue etichettata ready-for-dev, la implementa e apre una PR.
# Configurazione in .fucina.yml.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Numero della issue da lavorare"
        type: number
        required: true

concurrency:
  group: dev-agent-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  implementa:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ready-for-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Leggi la configurazione
        id: cfg
        run: |
          set -euo pipefail
          command -v yq >/dev/null 2>&1 || {
            echo "::error::yq non disponibile sul runner"; exit 1; }
          test -f .fucina.yml || {
            echo "::error::.fucina.yml assente: esegui prima fucina init"; exit 1; }

          TEST_CMD=$(yq -r '.test_command // ""' .fucina.yml)
          if [ -z "$TEST_CMD" ] || [ "$TEST_CMD" = "null" ]; then
            echo "::error::.fucina.yml non definisce test_command. L'agente non ha modo di verificare il proprio lavoro: interrompo."
            exit 1
          fi

          {
            echo "test_command=$TEST_CMD"
            echo "setup_command=$(yq -r '.setup_command // ""' .fucina.yml)"
            echo "modello=$(yq -r '.agente.modello // "claude-sonnet-5"' .fucina.yml)"
            echo "max_turns=$(yq -r '.agente.max_turns // 30' .fucina.yml)"
            echo "max_budget=$(yq -r '.agente.max_budget_usd // 2' .fucina.yml)"
            echo "max_iter=$(yq -r '.agente.max_iterazioni // 3' .fucina.yml)"
            echo "endpoint=$(yq -r '.endpoint // ""' .fucina.yml)"
            echo "strumenti=$(yq -r '.strumenti_permessi // [] | join(",")' .fucina.yml)"
          } >> "$GITHUB_OUTPUT"

      - name: Conta i tentativi precedenti
        id: tentativi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          MAX: ${{ steps.cfg.outputs.max_iter }}
        run: |
          set -euo pipefail
          N=$(gh issue view "$ISSUE" --json comments \
                --jq '[.comments[] | select(.body | contains("<!-- fucina:tentativo -->"))] | length')
          echo "Tentativi già effettuati: $N (massimo $MAX)"
          echo "n=$N" >> "$GITHUB_OUTPUT"

          if [ "$N" -ge "$MAX" ]; then
            gh issue edit "$ISSUE" --add-label needs-human --remove-label ready-for-dev
            gh issue comment "$ISSUE" --body \
              "L'agente ha esaurito i $MAX tentativi previsti senza chiudere la issue. Serve una persona: probabilmente la issue va riscritta o spezzata."
            echo "stop=true" >> "$GITHUB_OUTPUT"
          else
            echo "stop=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Segna il tentativo
        if: steps.tentativi.outputs.stop == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          gh issue edit "$ISSUE" --add-label in-progress --remove-label ready-for-dev
          gh issue comment "$ISSUE" --body \
            "<!-- fucina:tentativo -->Tentativo avviato: [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      - name: Prepara l'ambiente
        if: steps.tentativi.outputs.stop == 'false' && steps.cfg.outputs.setup_command != ''
        run: ${{ steps.cfg.outputs.setup_command }}

      - name: Esegui l'agente
        if: steps.tentativi.outputs.stop == 'false'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ steps.cfg.outputs.endpoint }}
          # PAT se presente: le PR e le label create col GITHUB_TOKEN di default
          # non fanno partire i workflow pull_request (stessa trappola del REQ-016).
          GH_TOKEN: ${{ secrets.FUCINA_PAT || secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          branch_prefix: "fucina/"
          # Non supportato su workflow_dispatch: l'action fallisce prima di avviare l'agente.
          track_progress: ${{ github.event_name != 'workflow_dispatch' }}
          prompt: |
            /dev-agent

            Implementa la issue #${{ github.event.issue.number || inputs.issue }} di
            questo repository, seguendo alla lettera il ruolo dev-agent.

            Il comando dei test è: ${{ steps.cfg.outputs.test_command }}
            Eseguilo e assicurati che passi prima di aprire la PR.

            Questo è il tentativo numero ${{ steps.tentativi.outputs.n }} su
            ${{ steps.cfg.outputs.max_iter }}.
          claude_args: |
            --model ${{ steps.cfg.outputs.modello }}
            --max-turns ${{ steps.cfg.outputs.max_turns }}
            --max-budget-usd ${{ steps.cfg.outputs.max_budget }}
            --allowedTools "${{ steps.cfg.outputs.strumenti }}"

      - name: Apri la PR con il corpo scritto dall'agente
        if: success() && steps.tentativi.outputs.stop == 'false'
        env:
          GH_TOKEN: ${{ secrets.FUCINA_PAT || secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          BASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin --prune

          BRANCH=$(git ls-remote --heads origin "fucina/issue-${ISSUE}-*" \
                   | sed 's|.*refs/heads/||' | sort | tail -1)
          if [ -z "$BRANCH" ]; then
            # Run verde senza branch: l'agente si è fermato a chiedere (REQ-031).
            # La label la mette il workflow, non l'agente: è stato deterministico.
            echo "Nessun branch prodotto: l'agente si è fermato. Applico needs-human."
            gh issue edit "$ISSUE" --add-label needs-human --remove-label in-progress
            gh issue comment "$ISSUE" --body \
              "L'agente si è fermato senza produrre codice: la sua domanda è nel commento qui sopra. Rispondi in un commento, poi togli \`needs-human\` e rimetti \`ready-for-dev\` per farlo ripartire."
            exit 0
          fi

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')" ]; then
            echo "PR già aperta su $BRANCH: niente da fare."
            exit 0
          fi

          TITOLO=$(gh issue view "$ISSUE" --json title -q .title)

          # Il corpo lo scrive l'agente in .fucina/pr-body.md sul branch.
          # L'action vieta all'agente di aprire PR da sé (è nel suo prompt di
          # sistema), quindi la apriamo qui con il testo che ha preparato.
          if git show "origin/$BRANCH:.fucina/pr-body.md" > /tmp/pr-body.md 2>/dev/null \
             && [ -s /tmp/pr-body.md ]; then
            printf '\n\nCloses #%s\n' "$ISSUE" >> /tmp/pr-body.md
            echo "Corpo della PR letto dal branch."
          else
            cat > /tmp/pr-body.md <<FINE
          **Corpo mancante.** L'agente non ha scritto \`.fucina/pr-body.md\`, quindi
          questa PR non ha le sezioni "Non fatto" e "Fatto in più". Leggi il diff per
          intero prima di approvare, e considera il ruolo da correggere.

          Closes #${ISSUE}
          FINE
            echo "::warning::.fucina/pr-body.md assente sul branch: PR aperta con corpo minimo."
          fi

          gh pr create --base "$BASE" --head "$BRANCH" --title "$TITOLO" --body-file /tmp/pr-body.md
          gh pr edit "$BRANCH" --add-label needs-review || true
          gh issue edit "$ISSUE" --remove-label in-progress || true

      - name: Segnala il fallimento del run
        if: failure() && steps.tentativi.outputs.stop == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          gh issue edit "$ISSUE" --remove-label in-progress
          gh issue comment "$ISSUE" --body \
            "Il run dell'agente è terminato con errore — possibile superamento del tetto di spesa o del numero di turni. [Log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
