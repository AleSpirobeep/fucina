# Configurazione della fucina per questo repo.
# Letta dai workflow in .github/workflows/. Modificala qui, non nei workflow.
version: 1

# Comandi del progetto. test_command è obbligatorio (REQ-013).
setup_command: "pip install -e '.[dev]'"
test_command: "pytest -q"

agente:
  modello: "claude-sonnet-5"
  max_turns: 60
  max_budget_usd: 3.00
  max_iterazioni: 3

# Configurazione del PM a cicli (workflow pm-agent.yml). Può mancare del tutto:
# ha default sensati. Si accende con scripts/pm.ps1 avvia. Vedi contracts/fucina-yml.md.
pm:
  modello: "claude-sonnet-5"         # default: claude-sonnet-5
  max_turns: 40                      # default: 40 (rivedere un diff costa meno che scriverlo)
  max_budget_usd: 2.00               # default: 2.00
  attesa_check_minuti: 15            # default: 15
  titolo_rapporto: "Rapporto del PM" # default: "Rapporto del PM"
  # Strumenti del PM: sola lettura più la scrittura del verdetto e degli ADR.
  # MAI fondere, chiudere, etichettare, commentare, fare commit o push da qui:
  # quegli effetti passano solo dal workflow (REQ-270).
  strumenti_permessi:
    - "Read"
    - "Glob"
    - "Grep"
    - "Write"
    - "Bash(gh pr view:*)"
    - "Bash(gh pr diff:*)"
    - "Bash(gh pr checks:*)"
    - "Bash(gh issue view:*)"
    - "Bash(gh run view:*)"
    - "Bash(gh run list:*)"
    - "Bash(git log:*)"
    - "Bash(git show:*)"
    - "Bash(node:*)"

# Configurazione dell'analista (skill /analista, sessione locale di Claude Code).
# Può mancare del tutto: ha default sensati. Non è un workflow — non consuma nulla
# finché non lo invochi, e non fa partire niente da solo.
analista:
  modello: "claude-sonnet-5"    # default: claude-sonnet-5
  max_turns: 80                 # default: 80 (un'analisi è fatta di giri di domande)
  max_budget_usd: 3.00          # default: 3.00
  max_domande_per_giro: 5       # default: 5
  # Strumenti dell'analista: legge tutto, scrive solo documenti, e su GitHub fa due
  # cose sole — la PR della spec e le issue "in-coda". Mai accendere la fucina:
  # niente gh workflow, niente ready-for-dev, niente merge (REQ-351).
  strumenti_permessi:
    - "Read"
    - "Glob"
    - "Grep"
    - "Write"
    - "Edit"
    - "Bash(node:*)"
    - "Bash(git:*)"
    - "Bash(gh issue view:*)"
    - "Bash(gh issue list:*)"
    - "Bash(gh issue create:*)"
    - "Bash(gh pr view:*)"
    - "Bash(gh pr create:*)"

# Strumenti che l'agente può usare oltre a quelli di sola lettura.
# ATTENZIONE: senza questa lista l'action concede solo Read/Glob/Grep/LS e
# l'agente non può modificare file né eseguire i test. Vedi ADR 2026-09-02-0900.
# Adatta i comandi allo stack del progetto.
strumenti_permessi:
  - "Edit"
  - "Write"
  - "Bash(pytest:*)"
  - "Bash(python:*)"
  - "Bash(python3:*)"
  - "Bash(pip:*)"
  - "Bash(git:*)"
  # gh in sola lettura. Label, commenti di stato e PR sono del workflow:
  # è deterministico, l'agente no. Mai "Bash(gh:*)": include "gh pr merge".
  - "Bash(gh issue view:*)"
  - "Bash(gh pr view:*)"

# Percorsi che l'agente non può modificare senza la label allow-test-changes.
percorsi_protetti:
  - "tests/**"
  - "**/*_test.*"
  - "**/*.test.*"
  - ".github/workflows/**"

# Fornitore del modello. Lasciare endpoint vuoto per api.anthropic.com.
# Vedi debito D-02: cambiare fornitore deve costare due righe, non un rewrite.
endpoint: ""
secret_auth: "CLAUDE_CODE_OAUTH_TOKEN"
