name: pm-agent

# Il PM a cicli (spec 003). Svegliato dagli eventi del repo, non da un processo in
# ascolto: ogni esecuzione rilegge lo stato da GitHub (PR needs-review, issue
# needs-human, coda) e lo passa a scripts/pm-coda.js, una funzione pura e testata
# che sceglie UNA azione. Se l'azione è deterministica (avviare il task
# successivo, rimandare check rossi o corpo incompleto, attendere i check) la
# esegue con `gh` e non chiama mai il modello. Se serve giudizio (revisione di
# una PR, risposta a una domanda) l'esecuzione si rilancia in workflow_dispatch
# con l'oggetto da lavorare e termina: il modello viene chiamato solo in quel
# contesto (T003; qui stampa solo un segnaposto). Dopo un'azione deterministica
# l'esecuzione rilancia una scansione di recupero, così il lavoro non si
# accumula. Un giro senza lavoro non scrive nulla (REQ-242) e non c'è mai più di
# un'esecuzione in corso per repo (concurrency).

on:
  pull_request:
    types: [labeled, unlabeled, closed]
  issues:
    types: [labeled, unlabeled, closed]
  workflow_dispatch:
    inputs:
      azione:
        description: "Azione da forzare"
        type: choice
        options: [scansione, revisione, domanda]
        default: scansione
      numero:
        description: "Numero della PR o issue (richiesto per revisione/domanda)"
        type: number
        required: false

concurrency:
  group: pm-agent
  cancel-in-progress: false

jobs:
  ciclo:
    # Filtro REQ-202: solo le label di stato del PM, i closed, gli unlabeled di
    # needs-human, e qualunque dispatch. github.event.action è comune a
    # pull_request e issues, quindi un'unica condizione copre entrambi i trigger.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'closed' ||
      (github.event.action == 'labeled' && contains(fromJSON('["needs-review","needs-human","in-coda"]'), github.event.label.name)) ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'needs-human')
    runs-on: ubuntu-latest
    # Copre l'attesa dei check (default pm.attesa_check_minuti: 15) più margine.
    # Se attesa_check_minuti viene alzato in .fucina.yml, alzare anche questo.
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write

    steps:
      - uses: actions/checkout@v5
        with:
          # Mai il ref della PR: script e configurazione si leggono dal ramo di
          # default, come dev-agent.yml (spec 001).
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Leggi la configurazione del PM
        id: cfg
        run: |
          set -euo pipefail
          command -v yq >/dev/null 2>&1 || {
            echo "::error::yq non disponibile sul runner"; exit 1; }
          test -f .fucina.yml || {
            echo "::error::.fucina.yml assente: esegui prima fucina init"; exit 1; }

          {
            echo "modello=$(yq -r '.pm.modello // "claude-sonnet-5"' .fucina.yml)"
            echo "max_turns=$(yq -r '.pm.max_turns // 40' .fucina.yml)"
            echo "max_budget=$(yq -r '.pm.max_budget_usd // 2.00' .fucina.yml)"
            echo "attesa_check=$(yq -r '.pm.attesa_check_minuti // 15' .fucina.yml)"
            echo "titolo_rapporto=$(yq -r '.pm.titolo_rapporto // "Rapporto del PM"' .fucina.yml)"
            echo "endpoint=$(yq -r '.endpoint // ""' .fucina.yml)"
          } >> "$GITHUB_OUTPUT"

          # REQ-270: nessuno strumento di mutazione tra quelli permessi al modello.
          DEFAULT_STRUMENTI='Read,Glob,Grep,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(gh run view:*),Bash(gh run list:*),Bash(git log:*),Bash(git show:*),Bash(node:*)'
          STRUMENTI=$(yq -r '.pm.strumenti_permessi // [] | join(",")' .fucina.yml)
          if [ -z "$STRUMENTI" ] || [ "$STRUMENTI" = "null" ]; then
            STRUMENTI="$DEFAULT_STRUMENTI"
          fi

          IFS=',' read -ra ELENCO <<< "$STRUMENTI"
          for ITEM in "${ELENCO[@]}"; do
            if [ "$ITEM" = "Bash" ] || [ "$ITEM" = "Bash(gh:*)" ] || [ "$ITEM" = "Bash(git:*)" ]; then
              echo "::error::pm.strumenti_permessi contiene uno strumento di mutazione ($ITEM): REQ-270 lo vieta."
              exit 1
            fi
            for VIETATO in "gh pr merge" "gh pr close" "gh pr comment" "gh pr edit" "gh issue comment" "gh issue edit" "gh issue create" "git commit" "git push"; do
              if printf '%s' "$ITEM" | grep -qF -- "$VIETATO"; then
                echo "::error::pm.strumenti_permessi contiene uno strumento di mutazione ($ITEM): REQ-270 lo vieta."
                exit 1
              fi
            done
          done
          echo "strumenti=$STRUMENTI" >> "$GITHUB_OUTPUT"

      - name: Determina la modalità
        id: modalita
        run: |
          set -euo pipefail
          # R3: la chiamata al modello avviene solo in workflow_dispatch con
          # un'azione diversa da scansione (l'oggetto arriva già scelto).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.azione }}" != "scansione" ]; then
            echo "modalita=modello" >> "$GITHUB_OUTPUT"
          else
            echo "modalita=scansione" >> "$GITHUB_OUTPUT"
          fi

      - name: Trova o crea l'issue di rapporto
        id: rapporto
        env:
          GH_TOKEN: ${{ secrets.FUCINA_PAT || secrets.GITHUB_TOKEN }}
          TITOLO: ${{ steps.cfg.outputs.titolo_rapporto }}
        run: |
          set -euo pipefail
          NUM=$(gh issue list --label rapporto-pm --state open --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            URL=$(gh issue create --title "$TITOLO" --label rapporto-pm \
              --body "Rapporto automatico del PM a cicli. Ogni azione compare qui come commento.")
            NUM="${URL##*/}"
            echo "Issue di rapporto creata: #$NUM"
          fi
          echo "numero=$NUM" >> "$GITHUB_OUTPUT"

      - name: Raccogli lo stato del repo
        if: steps.modalita.outputs.modalita == 'scansione'
        id: stato
        env:
          GH_TOKEN: ${{ secrets.FUCINA_PAT || secrets.GITHUB_TOKEN }}
          RAPPORTO: ${{ steps.rapporto.outputs.numero }}
        run: |
          set -euo pipefail
          STATO_FILE="$RUNNER_TEMP/fucina-pm-stato.json"

          ultimo_ha_marcatore() {
            local TIPO="$1" NUM="$2" BODY
            if [ "$TIPO" = "pr" ]; then
              BODY=$(gh pr view "$NUM" --json comments --jq '.comments[-1].body // ""')
            else
              BODY=$(gh issue view "$NUM" --json comments --jq '.comments[-1].body // ""')
            fi
            case "$BODY" in
              *'<!-- fucina:pm-umano -->'*) echo true ;;
              *) echo false ;;
            esac
          }

          PR_BASE=$(gh pr list --state open --json number,title,labels,body --jq \
            '[.[] | {numero: .number, titolo: .title, labels: [.labels[].name], corpo: (.body // "")}]')

          PR_JSON="[]"
          for NUM in $(echo "$PR_BASE" | jq -r '.[].numero'); do
            # Bucket assente (check non ancora registrati) è trattato come
            # "in-corso": subito dopo l'apertura i check impiegano qualche
            # secondo a comparire, e non vanno scambiati per "verde" (R8).
            BUCKET=$(gh pr checks "$NUM" --json state,bucket --jq '[.[].bucket]' 2>/dev/null || echo '[]')
            if echo "$BUCKET" | jq -e 'length == 0' >/dev/null; then
              CHECK="in-corso"
            elif echo "$BUCKET" | jq -e 'any(.[]; . == "fail" or . == "cancel")' >/dev/null; then
              CHECK="rosso"
            elif echo "$BUCKET" | jq -e 'any(.[]; . == "pending")' >/dev/null; then
              CHECK="in-corso"
            else
              CHECK="verde"
            fi
            VISTO=$(ultimo_ha_marcatore pr "$NUM")
            ELEMENTO=$(echo "$PR_BASE" | jq -c --argjson n "$NUM" '.[] | select(.numero == $n)')
            ELEMENTO=$(echo "$ELEMENTO" | jq -c --arg check "$CHECK" --argjson visto "$VISTO" '. + {check: $check, ultimoCommentoPm: $visto}')
            PR_JSON=$(echo "$PR_JSON" | jq -c --argjson e "$ELEMENTO" '. + [$e]')
          done

          ISSUE_BASE=$(gh issue list --state open --json number,title,labels --jq \
            --argjson rapporto "${RAPPORTO:-null}" \
            '[.[] | select(.number != $rapporto) | {numero: .number, titolo: .title, labels: [.labels[].name]}]')

          ISSUE_JSON="[]"
          for NUM in $(echo "$ISSUE_BASE" | jq -r '.[].numero'); do
            VISTO=$(ultimo_ha_marcatore issue "$NUM")
            ELEMENTO=$(echo "$ISSUE_BASE" | jq -c --argjson n "$NUM" '.[] | select(.numero == $n)')
            ELEMENTO=$(echo "$ELEMENTO" | jq -c --argjson visto "$VISTO" '. + {ultimoCommentoPm: $visto}')
            ISSUE_JSON=$(echo "$ISSUE_JSON" | jq -c --argjson e "$ELEMENTO" '. + [$e]')
          done

          jq -n --argjson rapporto "${RAPPORTO:-null}" --argjson pr "$PR_JSON" --argjson issue "$ISSUE_JSON" \
            '{rapporto: $rapporto, pr: $pr, issue: $issue}' > "$STATO_FILE"

          echo "file=$STATO_FILE" >> "$GITHUB_OUTPUT"

      - name: Decidi la prossima azione
        id: decisione
        run: |
          set -euo pipefail
          if [ "${{ steps.modalita.outputs.modalita }}" = "modello" ]; then
            # Oggetto già scelto dal dispatch: niente da decidere (T003 lo userà).
            {
              echo "azione=${{ inputs.azione }}"
              echo "numero=${{ inputs.numero }}"
              echo "motivo=dispatch esplicito per il modello"
              echo "dettagli_issue="
              echo "dettagli_task="
              echo "dettagli_manca="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OUT=$(node scripts/pm-coda.js < "${{ steps.stato.outputs.file }}")
          echo "Decisione: $OUT"
          {
            echo "azione=$(echo "$OUT" | jq -r '.azione')"
            echo "numero=$(echo "$OUT" | jq -r '.numero // empty')"
            echo "motivo=$(echo "$OUT" | jq -r '.motivo')"
            echo "dettagli_issue=$(echo "$OUT" | jq -r '.dettagli.issue // empty')"
            echo "dettagli_task=$(echo "$OUT" | jq -r '.dettagli.task // empty')"
            echo "dettagli_manca=$(echo "$OUT" | jq -r '(.dettagli.manca // []) | join(", ")')"
          } >> "$GITHUB_OUTPUT"

      - name: "Azione: avvia-task"
        if: steps.modalita.outputs.modalita == 'scansione' && steps.decisione.outputs.azione == 'avvia-task'
        env:
          GH_TOKEN: ${{ secrets.FUCINA_PAT || secrets.GITHUB_TOKEN }}
          NUMERO: ${{ steps.decisione.outputs.numero }}
        run: |
          set -euo pipefail
          gh issue edit "$NUMERO" --add-label ready-for-dev --remove-label in-coda

      - name: "Azione: attendi-check"
        if: steps.modalita.outputs.modalita == 'scansione' && steps.decisione.outputs.azione == 'attendi-check'
        env:
          GH_TOKEN: ${{ secrets.FUCINA_PAT || secrets.GITHUB_TOKEN }}
          NUMERO: ${{ steps.decisione.outputs.numero }}
          MINUTI: ${{ steps.cfg.outputs.attesa_check }}
        run: |
          set -euo pipefail
          if timeout "${MINUTI}m" gh pr checks "$NUMERO" --watch; then
            echo "Check della PR #$NUMERO conclusi entro il tetto di ${MINUTI} minuti."
          else
            ESITO=$?
            if [ "$ESITO" -eq 124 ]; then
              echo "::warning::Check della PR #$NUMERO non conclusi entro ${MINUTI} minuti."
              gh pr edit "$NUMERO" --add-label needs-human
              gh pr comment "$NUMERO" --body \
                "<!-- fucina:pm-umano -->I check non si sono conclusi entro il tetto di ${MINUTI} minuti. Verifica lo stato dei check e togli \`needs-human\` quando sono pronti."
            else
              echo "Check della PR #$NUMERO conclusi (esito $ESITO): la prossima scansione decide."
            fi
          fi

      - name: "Azione: rimanda-check-rossi"
        if: steps.modalita.outputs.modalita == 'scansione' && steps.decisione.outputs.azione == 'rimanda-check-rossi'
        env:
          GH_TOKEN: ${{ secrets.FUCINA_PAT || secrets.GITHUB_TOKEN }}
          NUMERO: ${{ steps.decisione.outputs.numero }}
          ISSUE: ${{ steps.decisione.outputs.dettagli_issue }}
        run: |
          set -euo pipefail
          FALLITI=$(gh pr checks "$NUMERO" --json name,bucket --jq \
            '[.[] | select(.bucket=="fail" or .bucket=="cancel") | "- " + .name] | join("\n")')
          {
            echo "I check non sono passati:"
            echo ""
            echo "$FALLITI"
            echo ""
            echo "Chiudo la PR; l'issue torna \`ready-for-dev\`."
          } > "$RUNNER_TEMP/fucina-commento.md"

          gh pr comment "$NUMERO" --body-file "$RUNNER_TEMP/fucina-commento.md"
          gh pr close "$NUMERO" --delete-branch

          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/fucina-commento.md"
            gh issue edit "$ISSUE" --add-label ready-for-dev --remove-label in-progress
          fi

      - name: "Azione: rimanda-corpo-incompleto"
        if: steps.modalita.outputs.modalita == 'scansione' && steps.decisione.outputs.azione == 'rimanda-corpo-incompleto'
        env:
          GH_TOKEN: ${{ secrets.FUCINA_PAT || secrets.GITHUB_TOKEN }}
          NUMERO: ${{ steps.decisione.outputs.numero }}
          ISSUE: ${{ steps.decisione.outputs.dettagli_issue }}
          MANCA: ${{ steps.decisione.outputs.dettagli_manca }}
        run: |
          set -euo pipefail
          {
            echo "Il corpo della PR non ha la sezione **${MANCA}**."
            echo ""
            echo "Chiudo la PR; l'issue torna \`ready-for-dev\`."
          } > "$RUNNER_TEMP/fucina-commento.md"

          gh pr comment "$NUMERO" --body-file "$RUNNER_TEMP/fucina-commento.md"
          gh pr close "$NUMERO" --delete-branch

          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/fucina-commento.md"
            gh issue edit "$ISSUE" --add-label ready-for-dev --remove-label in-progress
          fi

      - name: Commenta il rapporto
        if: >-
          steps.modalita.outputs.modalita == 'scansione' &&
          contains(fromJSON('["avvia-task","attendi-check","rimanda-check-rossi","rimanda-corpo-incompleto"]'), steps.decisione.outputs.azione)
        env:
          GH_TOKEN: ${{ secrets.FUCINA_PAT || secrets.GITHUB_TOKEN }}
          RAPPORTO: ${{ steps.rapporto.outputs.numero }}
          AZIONE: ${{ steps.decisione.outputs.azione }}
          NUMERO: ${{ steps.decisione.outputs.numero }}
          MOTIVO: ${{ steps.decisione.outputs.motivo }}
        run: |
          set -euo pipefail
          OGGETTO="${{ github.server_url }}/${{ github.repository }}/issues/${NUMERO}"
          RUN_LINK="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment "$RAPPORTO" --body \
            "**${AZIONE}** su ${OGGETTO} — ${MOTIVO}. [Esecuzione](${RUN_LINK})"

      - name: Rilancia per il modello
        if: >-
          steps.modalita.outputs.modalita == 'scansione' &&
          (steps.decisione.outputs.azione == 'revisione' || steps.decisione.outputs.azione == 'domanda')
        env:
          # Eccezione documentata (R3, R9): workflow_dispatch è tra i pochi eventi
          # che il GITHUB_TOKEN di default può risvegliare.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Rilancio in workflow_dispatch: azione=${{ steps.decisione.outputs.azione }} numero=${{ steps.decisione.outputs.numero }}"
          gh workflow run pm-agent.yml \
            -f azione="${{ steps.decisione.outputs.azione }}" \
            -f numero="${{ steps.decisione.outputs.numero }}"

      - name: Esegui il PM
        if: steps.modalita.outputs.modalita == 'modello'
        run: |
          set -euo pipefail
          echo "modello: T003"

      - name: Rilancia una scansione di recupero
        if: >-
          steps.modalita.outputs.modalita == 'scansione' &&
          contains(fromJSON('["avvia-task","attendi-check","rimanda-check-rossi","rimanda-corpo-incompleto"]'), steps.decisione.outputs.azione)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run pm-agent.yml -f azione=scansione

      - name: Segnala il fallimento del run
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.FUCINA_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM="${{ steps.rapporto.outputs.numero }}"
          if [ -z "$NUM" ]; then
            NUM=$(gh issue list --label rapporto-pm --state open --json number --jq '.[0].number // empty')
          fi
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body \
              "Esecuzione fallita. [Log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            echo "::warning::Nessuna issue di rapporto trovata: impossibile segnalare il fallimento."
          fi
